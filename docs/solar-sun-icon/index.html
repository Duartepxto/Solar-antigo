<main><h1>Estudo do Sol</h1><p>Uma única forma, em positivo e negativo. Tamanhos em píxeis CSS.</p>
<div class="comparison">

<div class="sample"><div class="frame"><img src="sun-black.svg" width="16" height="16" alt="Sol a 16 píxeis"></div><span>16</span></div>

</div></section>
<section class="panel dark" aria-label="Forma branca sobre preto"><div class="large"><img src="sun-white.svg" alt="Sol em branco, a 128 píxeis"></div><div class="sizes">
<div class="sample"><div class="frame"><img src="sun-white.svg" width="16" height="16" alt="Sol a 16 píxeis"></div><span>16</span></div>

</div><footer>Mesmo disco e corona em ambas as cores. A amostra de 16 px alarga opticamente a separação entre as duas massas. Estudo sem aplicação aos ícones instalados.</footer></main>
