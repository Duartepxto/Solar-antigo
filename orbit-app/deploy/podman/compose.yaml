name: ${COMPOSE_PROJECT_NAME:-orbit-podman}
services:
  orbit:
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile
      args:
        ENGINES: ${ENGINES:-}
    image: localhost/orbit-podman:${ORBIT_IMAGE_TAG:-local}
    init: true
    userns_mode: keep-id:uid=1001,gid=1001
    user: "1001:1001"
    restart: unless-stopped
    # On Windows this is the Linux Podman machine. The app must reach the
    # dynamically allocated, loopback-only desktop ports on that same host.
    network_mode: host
    volumes:
      - ${ORBIT_DATA_ROOT:?Run setup.sh first}:${ORBIT_DATA_ROOT}
      - ${PODMAN_SOCKET:?Run setup.sh first}:/run/orbit-podman.sock
    environment:
      HOME: ${ORBIT_DATA_ROOT}
      ORBIT_DATA_DIR: ${ORBIT_DATA_ROOT}/.orbit
      ORBIT_STATIC_DIR: /app/dist
      CONTAINER_HOST: unix:///run/orbit-podman.sock
      ORBIT_PORT: ${ORBIT_PORT:-8799}
      ORBIT_WEBHOOK_PORT: ${ORBIT_WEBHOOK_PORT:-8800}
      ORBIT_PUBLIC_URL: ${ORBIT_PUBLIC_URL:-http://localhost:8080}
      ORBIT_WEBHOOK_PUBLIC_URL: ${ORBIT_PUBLIC_URL:-http://localhost:8080}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:$$ORBIT_PORT/api/health | grep -q orbit']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: docker.io/library/caddy:2.11.4
    restart: unless-stopped
    network_mode: host
    depends_on:
      orbit:
        condition: service_healthy
    environment:
      ORBIT_HTTP_PORT: ${ORBIT_HTTP_PORT:-8080}
      ORBIT_PORT: ${ORBIT_PORT:-8799}
      ORBIT_WEBHOOK_PORT: ${ORBIT_WEBHOOK_PORT:-8800}
      ORBIT_HTTPS_HOST: ${ORBIT_HTTPS_HOST:-https-disabled.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
