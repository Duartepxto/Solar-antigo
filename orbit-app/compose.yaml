name: ${COMPOSE_PROJECT_NAME:-orbit}
services:
  orbit:
    init: true
    build:
      context: ./deploy/local
      args:
        BASE_IMAGE: ${ORBIT_BASE_IMAGE:-ghcr.io/dragonqlf/orbit:latest}
        ENGINES: ${ENGINES-@anthropic-ai/claude-code @openai/codex}
    image: ${ORBIT_LOCAL_IMAGE:-orbit-local:latest}
    restart: unless-stopped
    volumes:
      - data:/data
    ports:
      - "${ORBIT_BIND_ADDRESS:-127.0.0.1}:${ORBIT_HTTP_PORT:-8080}:80"
    environment:
      ORBIT_PORT: "8799"
      ORBIT_WEBHOOK_PORT: "8800"
      ORBIT_PUBLIC_URL: ${ORBIT_PUBLIC_URL:-http://localhost:${ORBIT_HTTP_PORT:-8080}}
      ORBIT_WEBHOOK_PUBLIC_URL: ${ORBIT_WEBHOOK_PUBLIC_URL:-${ORBIT_PUBLIC_URL:-http://localhost:${ORBIT_HTTP_PORT:-8080}}}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8799/api/health', { signal: AbortSignal.timeout(4000) }).then(async r => { if (!r.ok || !(await r.text()).includes('orbit')) process.exit(1); }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    network_mode: service:orbit
    environment:
      ORBIT_HTTPS_HOST: ${ORBIT_HTTPS_HOST:-}
      ORBIT_BIND_ADDRESS: ${ORBIT_BIND_ADDRESS:-127.0.0.1}
    command:
      - /bin/sh
      - -ec
      - |
        export ORBIT_UPSTREAM_SCHEME=http
        if [ -n "$$ORBIT_HTTPS_HOST" ] && [ "$$ORBIT_BIND_ADDRESS" != "127.0.0.1" ]; then
          echo "ORBIT_HTTPS_HOST requires ORBIT_BIND_ADDRESS=127.0.0.1; forward HTTPS through a trusted local proxy." >&2
          exit 1
        fi
        if [ -n "$$ORBIT_HTTPS_HOST" ]; then
          export ORBIT_UPSTREAM_SCHEME=https
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      orbit:
        condition: service_healthy
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  data:
    external: ${ORBIT_DATA_EXTERNAL:-false}
    name: ${ORBIT_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-orbit}_data}
  caddy_data:
  caddy_config:
